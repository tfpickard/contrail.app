name: Contrail
options:
  bundleIdPrefix: app.contrail
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ContrailKit:
    path: Packages/ContrailKit
  MapLibre:
    github: maplibre/maplibre-gl-native-distribution
    from: 6.10.0

targets:
  Contrail:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: ContrailKit
        product: ContrailCore
      - package: ContrailKit
        product: ContrailGeo
      - package: ContrailKit
        product: ContrailSensors
      - package: ContrailKit
        product: ContrailEstimator
      - package: ContrailKit
        product: ContrailLog
      - package: ContrailKit
        product: ContrailData
      - package: ContrailKit
        product: ContrailStatistics
      - package: ContrailKit
        product: ContrailTurbulence
      - package: ContrailKit
        product: ContrailMap
      - package: ContrailKit
        product: ContrailPhoto
      - package: ContrailKit
        product: ContrailForecast
      - package: ContrailKit
        product: ContrailIdentity
      - package: ContrailKit
        product: ContrailIFE
      - package: MapLibre
        product: MapLibre
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # §1: iPhone and iPad both first class -- both device families, no
        # per-idiom storyboard/plist branching.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Pushback #5: background execution is the single biggest omission a
        # multi-hour flight log needs. UIBackgroundModes + the runtime
        # allowsBackgroundLocationUpdates flag (set in LiveSensorSource) are
        # both required -- one without the other does nothing.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          Contrail uses your location to show your position, groundspeed, and
          progress along your flight route.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Contrail tracks your position for the whole flight, including while
          your screen is locked, so your flight log has no gaps.
        NSMotionUsageDescription: >-
          Contrail uses motion sensors to measure turbulence and detect
          takeoff, climb, cruise, descent, and landing.
        NSCameraUsageDescription: >-
          Contrail uses the camera to capture photos automatically tagged
          with your flight's position, altitude, and route.
        NSPhotoLibraryAddUsageDescription: >-
          Contrail saves the photos you take in-app to your Photos library.
        # Phase 3b: probing in-flight-entertainment moving-map endpoints on the
        # cabin Wi-Fi network requires the Local Network permission prompt (iOS 14+).
        NSLocalNetworkUsageDescription: >-
          Contrail looks for your aircraft's in-flight-entertainment system on the
          local cabin network to read outside air temperature, true airspeed, and
          wind -- data no phone sensor can measure on its own. This never requires
          purchasing Wi-Fi.
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        PRODUCT_BUNDLE_IDENTIFIER: app.contrail.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        # Automatic signing with Tom's personal team -- lets a device build/install
        # succeed the moment a phone is physically connected, with no manual
        # provisioning-profile step in Xcode first.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y8U56TJVZN
    schemes:
      Contrail:
        build:
          targets:
            Contrail: all
        run:
          config: Debug
        test:
          config: Debug
